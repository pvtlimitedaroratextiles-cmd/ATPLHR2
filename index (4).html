:root{--bg:#080d19;--surface:#101a2b;--surface2:#152238;--border:#27344b;--txt:#edf4ff;--muted:#8ea0b8;--accent:#7c78ff;--cyan:#38d6d0;--good:#36c998;--warn:#f7bd60;--bad:#f47b91;--shadow:0 18px 50px #0004}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 65% -20%,#283269 0,transparent 42%),var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}#app{display:flex;min-height:100vh}.sidebar{width:255px;background:#0c1423ed;border-right:1px solid var(--border);padding:24px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:5}.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 28px;font-family:Outfit;font-size:19px;font-weight:800}.brand-icon{background:linear-gradient(140deg,var(--accent),var(--cyan));border-radius:13px;padding:9px;color:#060c17}.small{font-size:11px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;font-weight:800}.navlabel{padding:19px 13px 9px}.nav{border:0;background:transparent;color:#a5b4c9;display:flex;gap:12px;align-items:center;width:100%;border-radius:12px;padding:13px 14px;text-align:left;font-weight:700;margin:3px 0}.nav:hover{background:#1a2940;color:white}.nav.active{background:linear-gradient(100deg,#4546a8a0,#22395950);color:white;box-shadow:inset 3px 0 var(--cyan)}.sidefooter{margin-top:auto;border:1px solid var(--border);border-radius:15px;padding:15px;background:#142138}.online{color:var(--good)}.main{margin-left:255px;width:calc(100% - 255px);padding:25px 35px 55px;max-width:1900px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}.crumb{color:var(--muted);font-size:12px}.top h1{font-family:Outfit;font-size:30px;margin:4px 0;letter-spacing:-.04em}.topright{display:flex;align-items:center;gap:12px}.avatar{width:42px;height:42px;border-radius:13px;background:linear-gradient(140deg,# s{border-color:var(--accent)}.search{max-width:340px}.tablewrap{width:100%;overflow:auto;border:1px solid var(--border);border-radius:12px}table{width:100%;border-collapse:collapse;white-space:nowrap}th{background:#1a2941;color:#93a8c4;text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase}th,td{padding:13px 15px;border-bottom:1px solid #24334a}tr:last-child td{border-bottom:0}tr:hover td{background:#1c294044}.chip{display:inline-block;border-radius:25px;padding:5px 10px;font-size:11px;font-weight:800;background:#1a3b39;color:#5de4ba}.chip.warn{background:#43331b;color:#ffd28d}.chip.bad{background:#452738;color:#ff9db2}.chip.purple{background:#2c2d55;color:#a5a0ff}.empty{text-align:center;padding:38px;color:var(--muted)}.iconbtn{border:1px solid var(--border);border-radius:8px;color:var(--txt);background:#19273d;padding:6px 9px;margin-right:4px}.iconbtn:hover{background:#354766}.section-desc{color:var(--muted);margin:-10px 0 17px}.inlinecards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.module{border:1px solid var(--border);border-radius:13px;padding:18px;background:#17253a}.module b{font-size:16px}.module p{font-size:12px;color:var(--muted);line-height:1.5}.module .symbol{font-size:27px;margin-bottom:14px}.progress{height:9px;background:#263650;border-radius:20px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,var(--accent),var(--cyan))}.dialog-back{position:fixed;inset:0;background:#020710c9;z-index:20;display:grid;place-items:center;padding:16px}.dialog{background:#111e32;border:1px solid #354862;border-radius:18px;box-shadow:0 25px 80px #0009;width:min(650px,100%);max-height:90vh;overflow:auto;padding:24px}.dialog header{display:flex;justify-content:space-between;align-items:center}.dialog h2{margin:0 0 20px;font-family:Outfit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.formgrid label{font-size:12px;color:#aebdd2;font-weight:700;display:grid;gap:7px}.formgrid .wide{grid-column:1/-1}.dialogfooter{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.toast{position:fixed;bottom:24px;right:24px;background:#29456a;color:#fff;padding:14px 18px;border-radius:12px;z-index:50;box-shadow:var(--shadow);max-width:430px}.muted{color:var(--muted)}.notice{border:1px solid #655439;background:#40331f55;padding:14px 16px;border-radius:12px;color:#f9d89d;margin-bottom:18px}.hide{display:none!important}canvas{max-width:100%}.filecell{display:flex;align-items:center;gap:8px}.filebadge{font-size:21px}.hamb{display:none}footer{font-size:11px;color:#7387a3;margin-top:22px;text-align:right}@media(max-width:1150px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.main{padding:25px}.inlinecards{grid-template-columns:1fr 1fr}}@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.open{transform:translateX(0)}.main{margin:0;width:100%;padding:18px}.hamb{display:inline-flex}.top h1{font-size:24px}.topright .pill{display:none}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:16px}.stat .number{font-size:23px}.banner{padding:19px}.banner .big{display:none}.inlinecards{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{margin-bottom:17px}}@media(max-width:390px){.stats{grid-template-columns:1fr}}

<body><div id="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">✦</div><div>ATPL <span style="color:var(--cyan)">NEXUS</span><div class="small" style="font-size:9px;margin-top:3px">HUMAN CAPITAL OS</div></div></div><div class="small navlabel">Workspace</div><nav id="nav"></nav><div class="sidefooter"><div class="small">SYSTEM STATUS</div><p style="margin:8px 0"><span class="online">●</span> Local workspace ready</p><small class="muted">Data is saved in this browser. Not synced to other devices.</small></div></aside><main class="main"><div class="top"><div style="display:flex;align-items:center;gap:12px"><button class="btn hamb" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div><div class="crumb">ATPL / HR Operations / <span id="crumb">Overview</span></div><h1 id="pageTitle">Command Center</h1></div></div><div class="topright"><span class="pill" id="clock"></span><span class="avatar">HR</span></div></div><div id="content"></div><footer>ATPL NEXUS • Browser-local workspace • v1.0</footer></main></div><div id="modal" class="hide"></div><div id="toast" class="toast hide"></div><input type="file" id="importFile" accept=".xlsx,.xls,.csv" class="hide"><input type="file" id="uploadFile" class="hide"><script>
'use strict';
const KEY='atpl-nexus-v1', NAV=[['dashboard','◈','Command Center'],['employees','♙','Employee Master'],['documents','▤','HR Documents'],['salary','▦','Salary Sheets'],['pf','◉','PF Challans'],['esic','✚','ESIC Challans'],['reports','▥','Reports & Exports'],['settings','⚙','Data & Settings']];
const shapes={employees:['code','name','department','designation','doj','gross','basic','hra','uan','esicNo','status'],salary:['month','code','name','basic','hra','gross','pf','esic','net'],pf:['month','reference','amount','date','status','notes'],esic:['month','reference','amount','date','status','notes'],documents:['name','category','employee','expiry','notes','fileName','fileType','fileData']};
const labels={code:'Employee Code',name:'Employee Name',department:'Department',designation:'Designation',doj:'Joining Date',gross:'Gross Salary',basic:'Basic',hra:'HRA',uan:'UAN',esicNo:'ESIC IP Number',status:'Status',month:'Wage Month (YYYY-MM)',reference:'TRRN / Challan Reference',amount:'Amount (₹)',date:'Payment Date',notes:'Notes',pf:'Employee PF (₹)',esic:'Employee ESIC (₹)',net:'Net Pay (₹)',category:'Document Category',employee:'Employee Code / Name',expiry:'Expiry Date',fileName:'File Name',fileType:'File Type',fileData:'File',};
const columns={employees:['code','name','department','designation','doj','gross','uan','esicNo','status'],salary:['month','code','name','basic','hra','gross','pf','esic','net'],pf:['month','reference','amount','date','status'],esic:['month','reference','amount','date','status'],documents:['name','category','employee','expiry','fileName']};
const titles={dashboard:'Command Center',employees:'Employee Master',documents:'HR Document Vault',salary:'Salary Intelligence',pf:'PF Challan Register',esic:'ESIC Challan Register',reports:'Reports & Analytics',settings:'Settings & Data'};
const rand=()=>crypto.randomUUID?.()||String(Date.now())+Math.random().toString(36);const fresh=()=>({employees:[],documents:[],salary:[],pf:[],esic:[]});let data;try{const parsed=JSON.parse(localStorage.getItem(KEY)||'null');data={...fresh(),...(parsed||{})};for(const k in shapes)if(!Array.isArray(data[k]))data[k]=[]}catch{data=fresh()}
let tab='dashboard',query='',sort={field:'',dir:1};const $=id=>document.getElementById(id),escapeHtml=x=>String(x??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){toast('Browser storage full. Export a backup or use smaller files.');return false}};const toast=m=>{const el=$('toast');el.textContent=m;el.classList.remove('hide');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hide'),3500)};
function route(t){tab=t;query='';sort={field:'',dir:1};$('sidebar').classList.remove('open');render()}function nav(){ $('nav').innerHTML=NAV.map(([k,i,l])=>`<button class="nav ${tab===k?'active':''}" onclick="route('${k}')"><span style="font-size:19px">${i}</span>${l}</button>`).join('') }
function render(){nav();$('pageTitle').textContent=titles[tab];$('crumb').textContent=titles[tab];$('clock').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});$('content').innerHTML=tab==='dashboard'?dashboard():tab==='reports'?reports():tab==='settings'?settings():listing(tab)}
function sum(arr,k){return arr.reduce((n,o)=>n+(Number(o[k])||0),0)}
function dashboard(){const active=data.employees.filter(e=>String(e.status).toLowerCase()!=='inactive').length;const months=[...new Set(data.salary.map(s=>s.month))].sort();const month=months.at(-1);const rows=data.salary.filter(r=>r.month===month);return `<div class="banner"><div><div class="small" style="color:#a6eff3">NEXT GENERATION HR WORKSPACE</div><h2>One place. Every HR operation.</h2><p>Employee records, secure-in-browser document handling, compliance registers, salary processing and actionable reports.</p></div><div class="big">✦</div></div><div class="grid stats"><div class="stat"><div class="muted">Total Employees</div><div class="number">${data.employees.length}</div><div class="hint">${active} marked active</div></div><div class="stat"><div class="muted">HR Documents</div><div class="number">${data.documents.length}</div><div class="hint">${data.documents.filter(d=>d.expiry && d.expiry<new Date().toISOString().slice(0,10)).length} expired</div></div><div class="stat"><div class="muted">Salary Records</div><div class="number">${data.salary.length}</div><div class="hint">${escapeHtml(month||'No month imported')}</div></div><div class="stat"><div class="muted">PF + ESIC Entries</div><div class="number">${data.pf.length+data.esic.length}</div><div class="hint">Challan payment tracking</div></div></div><div class="grid two"><div class="card"><h2>⚡ Quick Actions</h2><p class="section-desc">Choose a module to start working.</p><div class="inlinecards"><div class="module"><div class="symbol">♙</div><b>Employee Master</b><p>Add employees or import an Excel master.</p><button class="btn primary" onclick="route('employees')">Open Master →</button></div><div class="module"><div class="symbol">▤</div><b>Document Vault</b><p>Attach HR files with employee and expiry tracking.</p><button class="btn" onclick="route('documents')">Open Vault →</button></div><div class="module"><div class="symbol">▦</div><b>Salary Workspace</b><p>Import and export month-wise payroll records.</p><button class="btn" onclick="route('salary')">Open Payroll →</button></div></div></div><div class="card"><h2>Compliance Pulse</h2><p class="section-desc">Based on saved registers, not official portal verification.</p>${[['PF challan records',data.pf.length],['ESIC challan records',data.esic.length],['Employee UAN captured',data.employees.filter(r=>r.uan).length],['Employee ESIC numbers captured',data.employees.filter(r=>r.esicNo).length]].map(([a,b])=>`<div style="display:flex;justify-content:space-between;margin:15px 0 7px"><span>${a}</span><b>${b}</b></div><div class="progress"><div style="width:${Math.min(100,b/(data.employees.length||1)*100)}%"></div></div>`).join('')}</div></div><div class="card" style="margin-top:20px"><h2>Recent Activity</h2>${recent()}</div>`}
function recent(){const all=Object.entries(shapes).flatMap(([k])=>data[k].map(r=>({k,...r}))).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));return all.length?`<div class="tablewrap"><table><thead><tr><th>Module</th><th>Record</th><th>Last Updated</th></tr></thead><tbody>${all.slice(0,8).map(r=>`<tr><td>${escapeHtml(titles[r.k])}</td><td>${escapeHtml(r.name||r.reference||r.code)}</td><td>${escapeHtml((r.updatedAt||'').replace('T',' ').slice(0,16))}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Your workspace is ready. Add a record or import an Excel file to begin.</div>'}
function listing(k){const hint={employees:'Employee identity, joining details and statutory numbers.',documents:'Add HR certificates, policies, letters and expiry dates. Local files remain on this browser only.',salary:'Month-wise salary ledger. Calculations on the add form are illustrative; verify all statutory rules.',pf:'Store PF challan references, wage months, paid amounts and status.',esic:'Store ESIC challan references, wage months, paid amounts and status.'};let rows=[...data[k]].filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(query.toLowerCase())));if(sort.field)rows.sort((a,b)=>String(a[sort.field]??'').localeCompare(String(b[sort.field]??''),undefined,{numeric:true})*sort.dir);return `<div class="toolbar"><div><b style="font:700 19px Outfit">${data[k].length} Records</b><p class="muted" style="margin:5px 0">${hint[k]}</p></div><div class="actions"><button class="btn" onclick="exportSheet('${k}')">⇩ Export Excel</button><button class="btn" onclick="startImport('${k}')">⇧ Import Excel</button><button class="btn primary" onclick="editRecord('${k}')">＋ Add ${k==='documents'?'Document':'Record'}</button></div></div><div class="card"><div class="toolbar"><input class="field search" placeholder="Search all fields..." value="${escapeHtml(query)}" oninput="query=this.value;refreshTable()"><span class="muted">Click column headings to sort • ${rows.length} shown</span></div><div id="resultTable">${tableHTML(k,rows)}</div></div>`}
function refreshTable(){const k=tab;let rows=data[k].filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(query.toLowerCase())));if(sort.field)rows.sort((a,b)=>String(a[sort.field]??'').localeCompare(String(b[sort.field]??''),undefined,{numeric:true})*sort.dir);$('resultTable').innerHTML=tableHTML(k,rows)}
function tableHTML(k,rows){return `<div class="tablewrap"><table><thead><tr>${columns[k].map(c=>`<th style="cursor:pointer" onclick="sort.field='${c}';sort.dir*=-1;refreshTable()">${escapeHtml(labels[c]||c)} ↕</th>`).join('')}<th>Actions</th></tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${columns[k].map(c=>`<td>${cell(k,r,c)}</td>`).join('')}<td><button class="iconbtn" title="Edit" onclick="editRecord('${k}','${r.id}')">✎</button>${k==='documents'&&r.fileData?`<button class="iconbtn" title="Download attachment" onclick="downloadDoc('${r.id}')">⇩</button>`:''}<button class="iconbtn danger" title="Delete" onclick="delRecord('${k}','${r.id}')">✕</button></td></tr>`).join(''):`<tr><td colspan="${columns[k].length+1}" class="empty">No records found. Add one or import an Excel file.</td></tr>`}</tbody></table></div>`}
function cell(k,r,c){const v=r[c];if(c==='status')return `<span class="chip ${/pending/i.test(v)?'warn':/unpaid|inactive|failed/i.test(v)?'bad':''}">${escapeHtml(v||'—')}</span>`;if(['gross','basic','hra','pf','esic','net','amount'].includes(c))return money(v);if(c==='fileName')return v?`<span class="filecell">📎 ${escapeHtml(v)}</span>`:'<span class="muted">No attachment</span>';return escapeHtml(v||'—')}
function editRecord(k,id){const record=id?data[k].find(r=>r.id===id):{};if(id&&!record)return;const fields=shapes[k].filter(c=>!['fileData','fileType','fileName'].includes(c));$('modal').classList.remove('hide');$('modal').innerHTML=`<div class="dialog-back" onclick="closeModal(event)"><div class="dialog" onclick="event.stopPropagation()"><header><h2>${id?'Edit':'Add'} ${titles[k]}</h2><button class="btn" onclick="closeModal()">✕</button></header><form id="recordForm"><div class="formgrid">${fields.map(c=>fieldHTML(k,c,record[c])).join('')}${k==='documents'?`<label class="wide">Attach a file (max 1.5 MB, stored only in this browser)<input type="file" class="field" name="attachment" id="docAttachment" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.txt,.xlsx,.xls"></label>${record.fileName?`<div class="muted wide">Existing: ${escapeHtml(record.fileName)} (remains unless you select a new file)</div>`:''}`:''}</div><div class="dialogfooter"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button type="submit" class="btn primary">Save Record</button></div></form></div></div>`;$('recordForm').onsubmit=e=>submitRecord(e,k,id)}
function fieldHTML(k,c,v){let type=['doj','date','expiry'].includes(c)?'date':['gross','basic','hra','pf','esic','net','amount'].includes(c)?'number':c==='month'?'month':'text';let input=c==='status'?`<select class="field" name="${c}">${(k==='employees'?['Active','Inactive']:['Paid','Pending','Unpaid']).map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`:c==='category'?`<select class="field" name="category">${['Appointment Letter','Joining Documents','ID Proof','Policy','Training','Certificate','Medical','Audit','Other'].map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input class="field" type="${type}" name="${c}" value="${escapeHtml(v??'')}" ${type==='number'?'min="0" step="0.01"':''} ${c==='code'&&k==='employees'?'required':''} ${c==='name'?'required':''} ${c==='month'?'required':''}>`;return `<label class="${c==='notes'?'wide':''}">${labels[c]||c}${input}</label>`}
async function submitRecord(e,k,id){e.preventDefault();const form=e.target,fd=new FormData(form),old=id?data[k].find(r=>r.id===id):null,r={...(old||{}),id:id||rand(),updatedAt:new Date().toISOString()};for(const c of shapes[k])if(!['fileData','fileType','fileName'].includes(c))r[c]=String(fd.get(c)??'').trim();if(k==='employees'&&data[k].some(x=>x.code.toLowerCase()===r.code.toLowerCase()&&x.id!==id)){toast('Employee code already exists.');return}if(k==='documents'){const f=fd.get('attachment');if(f&&f.size){if(f.size>1.5*1024*1024){toast('File too large (max 1.5 MB). Use a Drive link for larger documents.');return}r.fileName=f.name;r.fileType=f.type;r.fileData=await new Promise((resolve,reject)=>{const rd=new FileReader();rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)})}}const index=data[k].findIndex(x=>x.id===id);if(index>=0)data[k][index]=r;else data[k].push(r);if(!save()){if(index>=0)data[k][index]=old;else data[k].pop();return}closeModal();render();toast('Record saved in this browser')}
function closeModal(ev){if(ev?.target!==ev?.currentTarget)return;$('modal').classList.add('hide');$('modal').innerHTML=''}function delRecord(k,id){if(!confirm('Delete this record? This cannot be undone unless you have a backup.'))return;data[k]=data[k].filter(r=>r.id!==id);save();render();toast('Record deleted')}
function downloadDoc(id){const r=data.documents.find(x=>x.id===id);if(!r?.fileData)return;const a=document.createElement('a');a.href=r.fileData;a.download=r.fileName||'attachment';document.body.append(a);a.click();a.remove()}
function csvDownload(name,records){const cols=Object.keys(records[0]||{});const csv=[cols.map(c=>'"'+c.replace(/"/g,'""')+'"').join(','),...records.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF',csv],{type:'text/csv;charset=utf-8'}));a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function exportSheet(k){const rows=data[k].map(({id,updatedAt,fileData,fileType,...r})=>r);if(window.XLSX){const ws=XLSX.utils.json_to_sheet(rows.length?rows:[Object.fromEntries(shapes[k].filter(c=>!['fileData','fileType'].includes(c)).map(x=>[x,'']))]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,k.toUpperCase());XLSX.writeFile(wb,`ATPL_${k}_${new Date().toISOString().slice(0,10)}.xlsx`)}else{csvDownload('ATPL_'+k,rows);toast('Excel library unavailable: CSV exported instead')}}
let importFor='';function startImport(k){importFor=k;const inp=$('importFile');inp.value='';inp.click()}
$('importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(!window.XLSX){toast('Excel library could not load. Check internet connection.');return}try{const book=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const sheet=book.Sheets[book.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});if(!rows.length){toast('Excel sheet is empty');return}const normalize=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');const aliases={code:['empcode','employeecode','cardno','empid'],name:['employeename','empname','staffname'],month:['wagemonth','salarymonth'],gross:['grosssalary','grosswages'],basic:['basicsalary','basicwages'],uan:['uannumber','pfuan'],esicNo:['esicnumber','ipnumber','esicip'],reference:['trrn','challanreference','challanno','challannumber'],amount:['paidamount','challanamount'],date:['paymentdate','paiddate'],doj:['joiningdate','dateofjoining'],net:['netpayable','netsalary'],pf:['employeepf','pf12'],esic:['employeeesic','esic075']};const converted=rows.map(raw=>{const map=Object.fromEntries(Object.entries(raw).map(([k,v])=>[normalize(k),v]));const result={id:rand(),updatedAt:new Date().toISOString()};for(const c of shapes[importFor])if(!['fileData','fileType','fileName'].includes(c)){const possible=[normalize(c),normalize(labels[c]||c),...(aliases[c]||[])];const key=possible.find(x=>x in map);result[c]=key!==undefined?String(map[key]??'').trim():''}return result});if(importFor==='employees'){const existing=new Set(data.employees.map(e=>e.code.toLowerCase()));const seen=new Set();let skipped=0;const valid=converted.filter(r=>{const c=r.code.toLowerCase();if(!c||existing.has(c)||seen.has(c)){skipped++;return false}seen.add(c);return true});if(!confirm(`Import ${valid.length} employees? ${skipped} missing/duplicate codes will be skipped. Existing records remain unchanged.`))return;data.employees.push(...valid);save();render();toast(`Imported ${valid.length} employees; skipped ${skipped}`)}else{if(!confirm(`Append ${converted.length} rows to ${titles[importFor]}? Existing records will be kept. Check Excel column names before proceeding.`))return;data[importFor].push(...converted);save();render();toast(`Imported ${converted.length} rows. Review mapped columns.`)}}catch(err){toast('Import failed: '+err.message)}});
function reports(){const months=[...new Set(data.salary.map(x=>x.month).filter(Boolean))].sort().reverse();const byMonth=months.map(month=>{const list=data.salary.filter(s=>s.month===month);return{month,employees:new Set(list.map(x=>x.code)).size,gross:sum(list,'gross'),pf:sum(list,'pf'),esic:sum(list,'esic'),net:sum(list,'net')}});return `<div class="grid stats"><div class="stat"><div class="muted">Total Gross (all salary records)</div><div class="number">${money(sum(data.salary,'gross'))}</div></div><div class="stat"><div class="muted">Total Net</div><div class="number">${money(sum(data.salary,'net'))}</div></div><div class="stat"><div class="muted">Employee PF Recorded</div><div class="number">${money(sum(data.salary,'pf'))}</div></div><div class="stat"><div class="muted">Employee ESIC Recorded</div><div class="number">${money(sum(data.salary,'esic'))}</div></div></div><div class="card"><div class="toolbar"><div><h2>Monthly Salary Summary</h2><p class="section-desc">These are entered amounts, not verified contributions or official challans.</p></div><button class="btn primary" onclick="exportMonthly()">⇩ Download Summary</button></div><div class="tablewrap"><table><thead><tr><th>Month</th><th>Employee Codes</th><th>Gross</th><th>PF</th><th>ESIC</th><th>Net</th></tr></thead><tbody>${byMonth.length?byMonth.map(r=>`<tr><td>${escapeHtml(r.month)}</td><td>${r.employees}</td><td>${money(r.gross)}</td><td>${money(r.pf)}</td><td>${money(r.esic)}</td><td>${money(r.net)}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">No salary data imported</td></tr>'}</tbody></table></div></div>`}
function exportMonthly(){const months=[...new Set(data.salary.map(x=>x.month))];const rows=months.map(month=>{const r=data.salary.filter(s=>s.month===month);return{Month:month,Employees:new Set(r.map(x=>x.code)).size,Gross:sum(r,'gross'),PF:sum(r,'pf'),ESIC:sum(r,'esic'),Net:sum(r,'net')}});if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Monthly Summary');XLSX.writeFile(wb,'ATPL_monthly_summary.xlsx')}else csvDownload('ATPL_monthly_summary',rows)}
function settings(){return `<div class="notice"><b>Important:</b> GitHub Pages is a static host. This version saves records in this browser's localStorage, not in Google Drive, Sheets or any cloud database. Other browsers and devices will NOT sync. This is not suitable as the only storage for confidential employee data.</div><div class="grid two"><div class="card"><h2>Data Backup & Restore</h2><p class="section-desc">Export an entire workspace as JSON. Backups may contain employee details and embedded documents: keep files private.</p><div class="actions"><button class="btn primary" onclick="backup()">⇩ Download JSON Backup</button><button class="btn" onclick="$('restoreFile').click()">⇧ Restore JSON Backup</button></div><input type="file" id="restoreFile" accept=".json" class="hide" onchange="restoreBackup(this)"><p class="muted" style="margin-top:18px">Storage usage: approximately ${(new Blob([JSON.stringify(data)]).size/1024).toFixed(1)} KB. Browser storage may be cleared by browser settings.</p></div><div class="card"><h2>Workspace Health</h2><p class="muted">${Object.keys(shapes).map(k=>`${titles[k]}: ${data[k].length} records`).join('<br>')}</p><button class="btn danger" onclick="clearAll()">✕ Delete Local Workspace</button></div></div><div class="card" style="margin-top:18px"><h2>Production Deployment Checklist</h2><p class="muted" style="line-height:1.8">For multi-device real-time use, add authenticated backend APIs, cloud file storage, role-based permissions, audit history, server-side validation, encryption, backups and actual payroll compliance validation. Never commit employee documents, salary details, tokens, or secrets to a public GitHub repository.</p></div>`}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({format:'ATPL-NEXUS-v1',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}));a.download='ATPL_NEXUS_BACKUP_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function restoreBackup(inp){const f=inp.files?.[0];if(!f)return;try{const json=JSON.parse(await f.text());if(json.format!=='ATPL-NEXUS-v1'||!json.data||!Object.keys(shapes).every(k=>Array.isArray(json.data[k])))throw Error('Not an ATPL NEXUS backup');if(!confirm('Replace ALL current local records with this backup? Export the current data first if needed.'))return;const previous=data;data=json.data;if(!save()){data=previous;return}render();toast('Backup restored')}catch(e){toast('Restore failed: '+e.message)}finally{inp.value=''}}function clearAll(){if(prompt('Type DELETE to erase all browser-local ERP data')!=='DELETE')return;data=fresh();save();route('dashboard');toast('Local records cleared')}
render();
</script></body></html>
